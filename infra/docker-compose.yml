version: "3.9"

services:
  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  mock-backend:
    build:
      context: ./mock-backend
      dockerfile: Dockerfile
    volumes:
      - ./mock-backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

# Per modalità CI semplificata (solo build, senza volumi e comandi di watch)
x-ci-override: &ci-override
  volumes: []
  command: echo "CI mode - no hot reload"

# Override in docker-compose.ci.yml